<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registro de Alumnos</title>

    <link rel="stylesheet" href="tarea.css">
</head>

<body>

    <main>

        <h1>Registro de Alumnos</h1>

        <form id="formulario">

            <label for="nombre">Nombre del alumno</label>

            <input type="text"
                   id="nombre"
                   placeholder="Escribe el nombre"
                   required>

            <label for="apellidoP">Apellido Paterno</label>

            <input type="text"
                   id="apellidoP"
                   placeholder="Escribe el apellido paterno"
                   required>

            <label for="apellidoM">Apellido Materno</label>

            <input type="text"
                   id="apellidoM"
                   placeholder="Escribe el apellido materno"
                   required>

            <label for="carrera">Carrera</label>

            <input type="text"
                   id="carrera"
                   placeholder="Escribe la carrera"
                   required>

            <label for="control">Número de control</label>

            <input type="text"
                   id="control"
                   placeholder="Escribe el número de control"
                   required>

            <button type="submit">
                Guardar
            </button>

        </form>

        <h2>Alumnos registrados</h2>

        <div id="lista"></div>

    </main>

    <script src="tarea.js"></script>

</body>

</html>
